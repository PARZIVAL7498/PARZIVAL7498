<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1521"/>
      <stop offset="1" stop-color="#1B2740"/>
    </linearGradient>
    <linearGradient id="fade" x1="520" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="nodemask">
      <rect x="0" y="0" width="1200" height="300" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

